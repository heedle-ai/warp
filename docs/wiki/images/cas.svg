<svg xmlns="http://www.w3.org/2000/svg" width="680" height="380" viewBox="0 0 680 380" role="img"><title>Refs move forward by compare-and-swap</title><desc>Two writers both read head c2 and build c3a and c3b on it. Only one git update-ref from c2 succeeds. The loser gets ErrConflict, re-reads the head and builds c4 on c3a. History stays linear and only grows.</desc><style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.w{stroke:#5F5E5A;stroke-width:1.5;fill:none}.dot{fill:#5F5E5A}
.d{stroke:#888780;stroke-width:0.8;fill:none;stroke-dasharray:5 4}
.l{font-size:12px;fill:#5F5E5A}.f{font-size:13px;fill:#444441}
.t1{font-size:14px;font-weight:600}.t2{font-size:12px}
.p rect{fill:#EEEDFE;stroke:#534AB7}.p .t1{fill:#3C3489}.p .t2{fill:#534AB7}
.g rect{fill:#E1F5EE;stroke:#0F6E56}.g .t1{fill:#085041}.g .t2{fill:#0F6E56}
.c rect{fill:#FAECE7;stroke:#993C1D}.c .t1{fill:#712B13}.c .t2{fill:#993C1D}
.n rect{fill:#F1EFE8;stroke:#5F5E5A}.n .t1{fill:#444441}.n .t2{fill:#5F5E5A}
@media (prefers-color-scheme:dark){
.w{stroke:#B4B2A9}.dot{fill:#B4B2A9}.d{stroke:#888780}.l{fill:#B4B2A9}.f{fill:#D3D1C7}
.p rect{fill:#3C3489;stroke:#AFA9EC}.p .t1{fill:#EEEDFE}.p .t2{fill:#CECBF6}
.g rect{fill:#085041;stroke:#5DCAA5}.g .t1{fill:#E1F5EE}.g .t2{fill:#9FE1CB}
.c rect{fill:#712B13;stroke:#F0997B}.c .t1{fill:#FAECE7}.c .t2{fill:#F5C4B3}
.n rect{fill:#444441;stroke:#B4B2A9}.n .t1{fill:#F1EFE8}.n .t2{fill:#D3D1C7}}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g class="g"><rect x="40" y="60" width="80" height="40" rx="6" stroke-width="0.8"/><text class="t1" x="80.0" y="80.0" text-anchor="middle" dominant-baseline="central">c1</text></g><path class="w" d="M120 80 L156 80" marker-end="url(#a)"/><g class="g"><rect x="160" y="60" width="80" height="40" rx="6" stroke-width="0.8"/><text class="t1" x="200.0" y="80.0" text-anchor="middle" dominant-baseline="central">c2</text></g><text class="l" x="200" y="46" text-anchor="middle">head</text><path class="w" d="M240 72 C 270 60, 290 50, 316 50" marker-end="url(#a)"/><path class="w" d="M240 88 C 270 100, 290 110, 316 110" marker-end="url(#a)"/><g class="g"><rect x="320" y="30" width="100" height="40" rx="6" stroke-width="0.8"/><text class="t1" x="370.0" y="50.0" text-anchor="middle" dominant-baseline="central">c3a</text></g><g class="c"><rect x="320" y="90" width="100" height="40" rx="6" stroke-width="0.8"/><text class="t1" x="370.0" y="110.0" text-anchor="middle" dominant-baseline="central">c3b</text></g><text class="l" x="440" y="54" text-anchor="start">update-ref from c2: wins</text><text class="l" x="440" y="114" text-anchor="start">update-ref from c2: ErrConflict</text><path class="w" d="M370 130 L370 170" marker-end="url(#a)"/><g class="n"><rect x="250" y="174" width="240" height="48" rx="6" stroke-width="0.8"/><text class="t1" x="370.0" y="189.0" text-anchor="middle" dominant-baseline="central">re-read head = c3a</text><text class="t2" x="370.0" y="208.0" text-anchor="middle" dominant-baseline="central">rebuild on it, retry</text></g><path class="w" d="M370 222 L370 254" marker-end="url(#a)"/><g class="g"><rect x="40" y="258" width="80" height="40" rx="6" stroke-width="0.8"/><text class="t1" x="80.0" y="278.0" text-anchor="middle" dominant-baseline="central">c1</text></g><path class="w" d="M120 278 L156 278" marker-end="url(#a)"/><g class="g"><rect x="160" y="258" width="80" height="40" rx="6" stroke-width="0.8"/><text class="t1" x="200.0" y="278.0" text-anchor="middle" dominant-baseline="central">c2</text></g><path class="w" d="M240 278 L276 278" marker-end="url(#a)"/><g class="g"><rect x="280" y="258" width="80" height="40" rx="6" stroke-width="0.8"/><text class="t1" x="320.0" y="278.0" text-anchor="middle" dominant-baseline="central">c3a</text></g><path class="w" d="M360 278 L396 278" marker-end="url(#a)"/><g class="g"><rect x="400" y="258" width="80" height="40" rx="6" stroke-width="0.8"/><text class="t1" x="440.0" y="278.0" text-anchor="middle" dominant-baseline="central">c4</text></g><text class="l" x="500" y="282" text-anchor="start">head: linear, only grows</text><text class="f" x="340" y="340" text-anchor="middle">Advance(ref, old, new): new must descend from old; at most one writer from a given old wins</text></svg>
